name: Build tinypy Blob on Windows

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-tinypy-blob:
    runs-on: windows-latest

    steps:
    - name: 檢出程式碼 (Check out repository)
      uses: actions/checkout@v4

    - name: 設定 Python 2.7 (Setup Python 2.7)
      uses: actions/setup-python@v5
      with:
        python-version: '2.7'

    - name: 建立產物目錄 (Ensure build directory exists)
      run: |
        if (!(Test-Path build)) { New-Item -ItemType Directory -Path build }
      shell: powershell

    - name: 執行 setup.py blob 打包 (Run setup.py blob)
      run: |
        python setup.py blob

    - name: 上傳產物 (Upload tinypy blob artifacts)
      uses: actions/upload-artifact@v4
      with:
        name: tinypy-blob-files
        path: |
          build/tinypy.h
          build/tinypy.c
        if-no-files-found: error
